name = "tessera-tiers"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[[routes]]
pattern = "tessera-tiers.kindlingai.dev"
custom_domain = true

[build]
command = "cargo install -q --locked worker-build@0.9.0 && worker-build --release"

[vars]
REPO = "kindlingai/tessera"
ORIGIN = "https://tessera-tiers.kindlingai.dev"
# "act" lets the queue bot change the merge queue. Any other value shows
# its plan on the board only.
QUEUE_BOT = "plan"

[triggers]
crons = ["* * * * *"]

# Hourly PR rate snapshots, and the queue bot's lease and failures.
[[kv_namespaces]]
binding = "STORE"
id = "97b971c8850a42ba81a68892830f3a3d"
