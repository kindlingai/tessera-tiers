name = "tessera-tiers"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[[routes]]
pattern = "tessera-tiers.kindlingai.dev"
custom_domain = true

[build]
command = "cargo install -q --locked worker-build@0.9.0 && worker-build --release"

[vars]
REPO = "kindlingai/tessera"
ORIGIN = "https://tessera-tiers.kindlingai.dev"

# Hourly PR rate snapshots for the Rates tab.
[[kv_namespaces]]
binding = "RATES"
id = "97b971c8850a42ba81a68892830f3a3d"
